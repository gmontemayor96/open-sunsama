# Builds an installable Android APK of the Open Sunsama Expo app.
# Put this file at .github/workflows/android-apk.yml in your fork of
# ShadowWalker2014/open-sunsama, then run it from the Actions tab
# ("Android APK" → "Run workflow"). The APK is attached to the run as an artifact.
#
# The release APK is signed with the default debug key, so it installs fine by
# sideloading but can't be published to the Play Store as-is.

name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: bun install

      - name: Generate native Android project
        working-directory: apps/expo-mobile
        run: bunx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/expo-mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: open-sunsama-android
          path: apps/expo-mobile/android/app/build/outputs/apk/release/*.apk
